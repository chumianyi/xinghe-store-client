name: Android CI (API 3)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK for Android 1.5+
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install 32-bit runtime libs (legacy SDK tools)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6-i386 libstdc++6:i386 zlib1g:i386

      - name: Cache Android 1.5 SDK + Build-Tools 19.1
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/platforms/android-3
            ~/android-sdk/build-tools/19.1.0
          key: android-api3-sdk-${{ runner.os }}-v1

      - name: Build APK
        run: bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xinghe-store-apk
          path: dist/*.apk
          if-no-files-found: error
